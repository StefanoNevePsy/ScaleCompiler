<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0e7a5b" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12211b" media="(prefers-color-scheme: dark)" />
    <script>
      // Applica il tema prima del render per evitare il flash iniziale.
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark')
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <meta name="description" content="Hub locale per la somministrazione, lo scoring e il monitoraggio di scale e questionari psicologici." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>ScaleCompiler — Hub valutazioni</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
